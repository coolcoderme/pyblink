[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyblink"
version = "0.1.0"
description = "Python Blink (Chromium) host library that talks to Chrome over CDP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "coolcoderme" }]
keywords = ["blink", "chromium", "chrome", "cdp", "devtools", "pyqt6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "PyQt6",
]

[project.urls]
Homepage = "https://github.com/coolcoderme/pyblink"
Repository = "https://github.com/coolcoderme/pyblink"

[tool.setuptools.packages.find]
include = ["pyblink"]
